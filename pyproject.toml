[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[project]
name = "rpg-engine"
version = "1.0.2"
description = "Headless deterministic RPG simulation and creator platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "hasnocool"}]
dependencies = [
  "aiosqlite>=0.22.1,<1",
  "asyncssh>=2.24.0,<3",
  "fastapi>=0.138.2,<1",
  "httpx>=0.28.1,<1",
  "packaging>=25,<27",
  "prompt-toolkit>=3.0.52,<4",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.3,<7",
  "rich>=15.0.0,<16",
  "textual>=8.2.8,<9",
  "typer>=0.27,<1",
  "uvicorn[standard]>=0.51,<1",
  "websockets>=17.0.1,<18",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15.21,<1",
]

[project.scripts]
rpg-engine = "rpg_engine.v1_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_engine"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/rpg_engine/tactical_engine.py" = ["I001"]
"src/rpg_engine/living.py" = ["RUF046"]
"src/rpg_engine/timeline.py" = ["I001"]
"tests/test_timeline.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rpg_engine"]

[tool.coverage.run]
source = ["rpg_engine"]
branch = true
